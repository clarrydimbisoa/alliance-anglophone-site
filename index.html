<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alliance Anglophone</title>
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <div class="lang-landing">
    <img class="brand-logo" src="assets/logo-aa.png" alt="Alliance Anglophone logo" />

    <h1>Alliance Anglophone</h1>
    <p class="tagline">
      Professional English, Employability & International Opportunities
    </p>

    <div class="lang-dropdown">
      <button class="lang-btn" id="langBtn">Language ▾</button>
      <div class="lang-menu" id="langMenu">
        <a href="en/index.html">English (EN)</a>

        <!-- FR and MG intentionally disabled until complete -->
        <a class="disabled" href="#" onclick="return false;">Français (FR) — coming soon</a>
        <a class="disabled" href="#" onclick="return false;">Malagasy (MG) — coming soon</a>
      </div>
    </div>

    <a class="primary-cta" href="en/index.html">Enter the English Website</a>
  </div>

  <script>
    const btn = document.getElementById("langBtn");
    const menu = document.getElementById("langMenu");

    btn.addEventListener("click", () => {
      menu.classList.toggle("show");
    });

    document.addEventListener("click", (e) => {
      if (!btn.contains(e.target) && !menu.contains(e.target)) {
        menu.classList.remove("show");
      }
    });
  </script>
</body>
</html>
