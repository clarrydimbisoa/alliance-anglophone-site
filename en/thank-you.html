<!DOCTYPE html>
<html lang="en">
<head>

  <title>Thank You | Alliance Anglophone</title>
  <link rel="stylesheet" href="../assets/style.css" />
</head>
<body>

<header class="topbar">
  <div class="container navwrap">

      <span>Alliance Anglophone</span>

    </p>

      <a href="index.html" class="btn primary">Return to Home</a>
    </p>

<footer class="footer">

    <small>© <span id="year"></span> Alliance Anglophone</small>
  </div>

  document.getElementById("year").textContent = new Date().getFullYear();
